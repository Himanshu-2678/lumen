<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f7f7f2"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2933">Lumen Architecture</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="18" fill="#52606d">Evidence-grounded document question answering</text>

  <g font-family="Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle">
    <rect x="70" y="190" width="220" height="100" rx="10" fill="#d9eaf7" stroke="#2779bd" stroke-width="3"/>
    <text x="180" y="232">Browser UI</text><text x="180" y="262" font-size="16">Upload, import, query</text>

    <rect x="360" y="190" width="220" height="100" rx="10" fill="#e4def7" stroke="#6554c0" stroke-width="3"/>
    <text x="470" y="232">FastAPI</text><text x="470" y="262" font-size="16">API and workspace cookie</text>

    <rect x="650" y="150" width="220" height="100" rx="10" fill="#d8f3dc" stroke="#2f855a" stroke-width="3"/>
    <text x="760" y="192">Ingestion</text><text x="760" y="222" font-size="16">Parse, chunk, embed</text>

    <rect x="650" y="300" width="220" height="100" rx="10" fill="#d8f3dc" stroke="#2f855a" stroke-width="3"/>
    <text x="760" y="342">Retrieval</text><text x="760" y="372" font-size="16">Vector + BM25 + rerank</text>

    <rect x="940" y="150" width="220" height="100" rx="10" fill="#fce8d5" stroke="#c05621" stroke-width="3"/>
    <text x="1050" y="192">Neon</text><text x="1050" y="222" font-size="16">Documents and chunks</text>

    <rect x="940" y="300" width="220" height="100" rx="10" fill="#fce8d5" stroke="#c05621" stroke-width="3"/>
    <text x="1050" y="342">ChromaDB</text><text x="1050" y="372" font-size="16">Embeddings and metadata</text>

    <rect x="650" y="490" width="220" height="100" rx="10" fill="#d9eaf7" stroke="#2779bd" stroke-width="3"/>
    <text x="760" y="532">Confidence Gate</text><text x="760" y="562" font-size="16">Answer or refuse</text>

    <rect x="940" y="490" width="220" height="100" rx="10" fill="#f9d8e5" stroke="#b83280" stroke-width="3"/>
    <text x="1050" y="532">Groq LLM</text><text x="1050" y="562" font-size="16">Strict JSON answer</text>
  </g>

  <g stroke="#52606d" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M290 240 H360"/><path d="M580 220 H650"/><path d="M580 260 C620 260 620 350 650 350"/>
    <path d="M870 200 H940"/><path d="M870 350 H940"/><path d="M760 400 V490"/>
    <path d="M870 540 H940"/><path d="M1160 540 C1280 540 1280 240 1160 240"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
  </defs>
</svg>
